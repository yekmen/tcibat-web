<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Modern Scaffolding & Renaissance Emblem -->
  <rect width="120" height="120" rx="16" fill="#F8FAFC" />
  
  <!-- Outer Frame / Scaffolding Structure -->
  <!-- Left Pole -->
  <rect x="28" y="22" width="6" height="76" rx="2" fill="#1D428A" />
  <!-- Right Pole -->
  <rect x="86" y="22" width="6" height="76" rx="2" fill="#1D428A" />
  <!-- Top Horizontal Bar -->
  <rect x="28" y="28" width="64" height="5" rx="1.5" fill="#1D428A" />
  <!-- Middle Horizontal Bar -->
  <rect x="28" y="58" width="64" height="5" rx="1.5" fill="#1D428A" />
  <!-- Bottom Horizontal Bar -->
  <rect x="28" y="88" width="64" height="5" rx="1.5" fill="#1D428A" />

  <!-- Diagonal Braces (Cross / Scaffolding truss) -->
  <line x1="34" y1="33" x2="86" y2="58" stroke="#E8584A" stroke-width="3.5" stroke-linecap="round" />
  <line x1="86" y1="33" x2="34" y2="58" stroke="#E8584A" stroke-width="3.5" stroke-linecap="round" />
  
  <line x1="34" y1="63" x2="86" y2="88" stroke="#E8584A" stroke-width="3.5" stroke-linecap="round" />
  <line x1="86" y1="63" x2="34" y2="88" stroke="#E8584A" stroke-width="3.5" stroke-linecap="round" />

  <!-- Safety / Node Highlights -->
  <circle cx="31" cy="30" r="4" fill="#1D428A" />
  <circle cx="89" cy="30" r="4" fill="#1D428A" />
  <circle cx="31" cy="60" r="4" fill="#1D428A" />
  <circle cx="89" cy="60" r="4" fill="#1D428A" />
  <circle cx="31" cy="90" r="4" fill="#1D428A" />
  <circle cx="89" cy="90" r="4" fill="#1D428A" />

  <!-- Centered R Monogram Shield -->
  <circle cx="60" cy="60" r="15" fill="#FFFFFF" stroke="#1D428A" stroke-width="2.5" />
  <text x="60" y="66" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#1D428A" text-anchor="middle">R</text>
</svg>
